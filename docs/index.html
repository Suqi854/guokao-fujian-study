<!doctype html>
<html lang="zh-CN">
  <head>

    <meta

      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="知序：国考与福建省考基础学习工作台。知识、练习、错题与申论写作，记录保存在本机。"
    />
    <title>知序 · 公考学习工作台</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css" />
    <script src="./content.js" defer></script>
    <script src="./expansion.js" defer></script>

    <script src="./crossstudy.js" defer></script>
    <script src="./targeting-content.js" defer></script>
    <script src="./focused-content.js" defer></script>
    <script src="./gap-content.js" defer></script>
    <script src="./applied-content.js" defer></script>
    <script src="./review-depth.js" defer></script>
    <script src="./core-depth.js" defer></script>
    <script src="./verbal-logic-depth.js" defer></script>
    <script src="./growth-argument-depth.js" defer></script>
    <script src="./travel-count-depth.js" defer></script>
    <script src="./weighted-depth.js" defer></script>
    <script src="./semantic-argument-depth.js" defer></script>
    <script src="./foundations-depth.js" defer></script>
    <script src="./quant-paths.js" defer></script>
    <script src="./verbal-paths.js" defer></script>
    <script src="./reasoning-paths.js" defer></script>
    <script src="./growth-reading-paths.js" defer></script>
    <script src="./civic-visual-paths.js" defer></script>
    <script src="./catalog.js" defer></script>
    <script src="./methods.js" defer></script>
    <script src="./comparisons.js" defer></script>
    <script src="./verified-methods.js" defer></script>
    <script src="./focused-methods.js" defer></script>
    <script src="./coverage-map.js" defer></script>
    <script src="./app.js" defer></script>

  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <aside class="sidebar">
      <a class="brand" href="#home"
        ><span class="brand-mark">知</span
        ><span>知序<small>每一步，都算数。</small></span></a
      >
      <nav id="navigation" aria-label="主导航"></nav>
      <div class="sidebar-bottom">
        <span class="status-dot"></span> 记录仅存本机
        <p>静下来，弄懂一个知识点。</p>
        <a href="#settings">备份与内容说明 ↗</a>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <span class="mobile-brand">知序<span> / </span></span
        ><span id="page-title">学习概览</span>
        <div class="top-actions">
          <label class="sr-only" for="exam">备考方向</label
          ><select id="exam">
            <option value="both">国考 + 福建省考</option>
            <option value="national">国考</option>
            <option value="fujian">福建省考</option></select
          ><a
            href="#settings"
            class="icon-button"
            aria-label="备份与设置"
            id="settings-link"
          ></a>
        </div>
      </header>
      <main id="main" tabindex="-1"></main>
      <footer>
        独立学习工作台 · 知识基础版 <a href="#settings">查看内容与来源说明</a>
      </footer>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript
      >此学习工具需要启用 JavaScript。个人学习记录仅保存在当前浏览器。</noscript
    >
  </body>
</html>
